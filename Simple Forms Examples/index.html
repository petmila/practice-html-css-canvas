<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Подключение стиля из папки css -->
    <meta charset="UTF-8">

    <!-- Для корректного масшабирования при изменении размера экрана -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Подключение стиля из папки css -->
    <link rel="stylesheet" href="css/style.css"> 

    <!-- Подключение шрифта с сайте GoogleFonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">
    
    <title>Kiberpunk Simple Forms Example</title>
</head>
<body>
    <div class="wrapper">
        <div class="row">
            <div class="column">
                <img src="images/clouds.png" alt="Snow" style="width:100%">
            </div>
            <div class="column">
                <img src='images/clouds_2.png' alt="Forest" style="width:100%">
            </div>
            <div class="column">
                <img src='images/clouds_3.png' alt="Mountains" style="width:100%">
            </div>
        </div>
        <div class="title">
            Kiberpunk Simple Forms Example <!-- Название нашей web-инсталляции -->
        </div>
        <canvas></canvas> <!-- Наш canvas -->

        <!-- Контейнер для кнопок -->
        <div class="menu">
            <button class="changeButton">Serve breakfast!</button>
            <button class="clearButton">Clear table!</button>
        </div>
    </div>
    <script src="js/script.js"></script> <!-- Подключение скрипта из папки js -->
</body>
</html>
